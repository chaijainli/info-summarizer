name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          # subosito/flutter-action already sets ${{ env.FLUTTER_ROOT }} for us

      - name: Verify Gradle wrapper
        run: |
          test -s android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 --decode > android/app/upload-keystore.jks
            echo "KEYSTORE_PATH=android/app/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get dependencies
        run: flutter pub get

      - name: Show Flutter SDK detection
        run: |
          echo "FLUTTER_ROOT env: $FLUTTER_ROOT"
          echo "Flutter version:"
          flutter --version
          echo "--- android/local.properties ---"
          cat android/local.properties || echo "(not found)"
          echo "--- file path check ---"
          ls -la android/local.properties 2>/dev/null || true
          if [ -n "$FLUTTER_ROOT" ]; then
            echo "--- Flutter tools gradle path ---"
            ls -la "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null || echo "Flutter tools gradle NOT FOUND"
          else
            echo "ERROR: FLUTTER_ROOT is not set!"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
